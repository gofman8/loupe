name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check all shell scripts
        run: ci/shellcheck.sh

  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets

  fuzz-replay:
    name: Fuzz corpus replay
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg=fuzzing
      CARGO_TARGET_DIR: /tmp/cargo-target-loupe-fuzz-replay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Replay helpers and committed inputs
        run: |
          cargo test --manifest-path fuzz/Cargo.toml --lib
          cargo test --manifest-path fuzz/runners/Cargo.toml --features stdin_fuzz --bins
      - name: Verify runner generation and replay failures
        run: |
          sh fuzz/test-harness.sh
          sh fuzz/src/bin/gen_target.sh
          git diff --exit-code -- fuzz/runners/src/bin fuzz/targets.h
          test -z "$(git ls-files --others --exclude-standard fuzz/runners/src/bin fuzz/targets.h)"
